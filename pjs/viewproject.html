<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Project</title>
    <link rel="stylesheet" href="/reset.css">
    <link rel="stylesheet" href="/main.css">
    <script src="/preload.js"></script>
    <script src="/pjs/q5.js"></script>
    <script src="/pjs/pjscompat.js"></script>
    <script defer>
        const slug = new URLSearchParams(window.location.search).get("slug");
        const projectMeta = fetch("/pjs/projects/index.json")
            .then(file => file.text())
            .then(content => {
                for (let p of JSON.parse(content)) {
                    if (p.slug === slug) return p;
                }
            });

        const projectSource = async meta => fetch(`/pjs/projects/${slug}.js`)
            .then(file => file.text())
            .then(src => transformPJS(src, meta));

        document.addEventListener("DOMContentLoaded", async function () {
            const meta = await projectMeta;
            document.title = meta.title;

            document.querySelector("summary>h1").textContent = meta.title;
            document.querySelector("summary>p").textContent = meta.desc;
            document.querySelector("summary>footer").textContent = `Created ${(new Date(meta.created)).toDateString()}`;
        });


        async function setup() {
            const meta = await projectMeta;
            const script = document.createElement("script");
            script.type = "module";
            script.textContent = await projectSource(meta);
            document.head.appendChild(script);

            createCanvas(meta.width, meta.height);
            angleMode(DEGREES);
            background(255);
        }
    </script>
</head>

<body>
    <article>
        <summary>
            <h1></h1>
            <p></p>
            <footer></footer>
        </summary>
        <main>
        </main>
    </article>
</body>

</html>
